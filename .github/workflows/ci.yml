name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        # ⚠️ 不要设 ELECTRON_SKIP_BINARY_DOWNLOAD=1
        #    src/main/logger.test.ts 会 import('electron') —— 二进制没下载时
        #    整个模块加载失败:
        #      "Electron failed to install correctly, please delete node_modules/electron"
        #    ⇒ 少了它这个测试文件永远红(它跑的是纯函数, 但 require 需要它存在)。
        #    代价是多下 ~100 MB, 换来 CI 能绿。

      - name: Typecheck (renderer + shared)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron main process)
        run: npx tsc --noEmit -p tsconfig.electron.json

      # 只拦 error, 不拦 warning。
      #   为什么不用 --max-warnings 0: 存量还有 ~147 条 warning, 绝大多数是历史遗留的
      #   no-explicit-any（集中在测试文件和各种 any 兜底处）。把它设成 0 会让这一步
      #   从第一天就红, 于是大家学会无视它 —— 那还不如没有。
      #   现在的契约是: **error 一律阻塞, warning 全量打印当债务清单**。
      #   债清完后删掉这行注释, 改用 `npm run lint:strict`（带 --max-warnings 0）。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build renderer
        run: npx vite build

      - name: Build main process
        run: npm run electron:build

      - name: Verify multi-language docs are in sync
        # README.md / PRIVACY.md and their translations are generated from
        # docs/readme/*.md and docs/privacy/*.md. If a source file was edited
        # without re-running the generator, this fails.
        run: node scripts/gen-readme.mjs --check

  e2e:
    name: E2E (disabled — Playwright/Electron incompatibility, see docs/E2E-STATUS.md)
    runs-on: ubuntu-latest
    # Disabled on purpose: the suite cannot start the app at all.
    #
    # playwright-core's Electron launcher passes --remote-debugging-port=0
    # *before* the app path; Electron 33's Node CLI rejects unknown options
    # there ("bad option"), so the app never starts and every test fails at
    # launch. Every Playwright release from 1.30 to 1.64 does this, so it is
    # not a version regression. Electron 33 does accept the switch *after* the
    # app path, which is the basis of the fix options in docs/E2E-STATUS.md.
    #
    # Kept here (disabled) rather than deleted, so the work stays visible and
    # the intended setup is one `if: false` away from being restored.
    if: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build renderer and main process
        run: |
          npx vite build
          npm run electron:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite under a virtual display
        # Electron needs an X server on Linux.
        run: xvfb-run -a npm run test:e2e

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    # Blocking gate: the repository has been scrubbed of machine-local paths
    # and obvious credentials, so a regression here must fail the build.
    steps:
      - uses: actions/checkout@v4

      - name: No machine-local absolute paths
        run: |
          set -euo pipefail
          # 只抓 **macOS 本机**路径: /Users/<name>
          # 排除 Windows 盘符形式 (C:/Users/Public/ 之类) —— 那是上传目标目录,
          # 不是某台开发机的家目录, 是真阳性会造成误报。
          #
          # `(^|[^A-Za-z0-9:])` 前缀: 前面不能紧跟盘符字母+冒号。
          if git grep -nE '(^|[^A-Za-z0-9:])/Users/[A-Za-z0-9._-]+' -- . ; then
            echo '::error::Found machine-local absolute paths. Use relative paths or a <USERNAME> placeholder.'
            exit 1
          fi
          echo 'No machine-local paths found.'

      - name: No obvious credentials committed
        run: |
          set -euo pipefail
          if git grep -nEi '(api[_-]?key|bot[_-]?token|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}' -- . \
             ':!package-lock.json' ':!docs/**' ':!*.md' ; then
            echo '::error::Possible credential committed. Remove it and rotate it.'
            exit 1
          fi
          echo 'No obvious credentials found.'
